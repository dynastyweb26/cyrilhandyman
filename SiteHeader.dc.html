<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="background:#0A0A0B;font-family:'Instrument Sans',system-ui,sans-serif">
  <div style="display:flex;justify-content:space-between;gap:24px;padding:10px 56px;border-bottom:1px solid #1F1F23;font:400 13px/1.4 'Instrument Sans',sans-serif;color:#B4B0A8">
    <span>Forney, TX · Serving Kaufman County and the towns around it</span>
    <span>Working wholeheartedly, one job at a time</span>
  </div>
  <nav aria-label="Primary" style="display:flex;align-items:center;justify-content:space-between;gap:32px;padding:18px 56px;border-bottom:1px solid #1F1F23">
    <a href="/" aria-label="Cyril Handyman &amp; Door, home" style="display:flex;align-items:center;gap:14px;min-height:44px;text-decoration:none;color:#F5F3EF">
      <span style="position:relative;flex:none;width:46px;height:46px;border-radius:50%;background:#0A0A0B;border:1px dashed #3A3A40;overflow:hidden;display:flex;align-items:center;justify-content:center;font:600 8px/1 ui-monospace,Menlo,monospace;color:#8F8B84">LOGO<img src="{{ px }}" alt="" data-slot="logo" width="92" height="92" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain"></span>
      <span style="font:800 17px/1 'Bricolage Grotesque',sans-serif;letter-spacing:.02em;text-transform:uppercase">Cyril Handyman &amp; Door</span>
    </a>
    <div style="display:flex;align-items:center;gap:40px">
      <ul style="display:flex;align-items:center;gap:30px;margin:0;padding:0;list-style:none">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
          <li><a href="{{ l.href }}" aria-current="{{ l.cur }}" style="display:inline-flex;align-items:center;min-height:44px;padding-top:2px;box-sizing:border-box;font:500 16px/1 'Instrument Sans',sans-serif;color:{{ l.color }};text-decoration:none;border-bottom:2px solid {{ l.bc }};transition:color .15s,border-color .15s" style-hover="color:#FFFFFF;border-bottom-color:#CC0000" style-focus="outline:2px solid #F5F3EF;outline-offset:4px">{{ l.label }}</a></li>
        </sc-for>
      </ul>
      <a href="tel:+19453444580" style="display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 24px;background:#CC0000;color:#FFFFFF;font:700 16px/1 'Instrument Sans',sans-serif;text-decoration:none;transition:background-color .15s,transform .1s" style-hover="background-color:#A80000" style-active="background-color:#8F0000;transform:translateY(1px)" style-focus="outline:2px solid #F5F3EF;outline-offset:3px">Call 945-344-4580</a>
    </div>
  </nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:140},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;Services&quot;,&quot;Gallery&quot;,&quot;Service areas&quot;,&quot;Reviews&quot;,&quot;About&quot;,&quot;FAQ&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? '';
    const items = [['Services', '/#services'], ['Gallery', '/gallery'], ['Service areas', '/service-areas'], ['Reviews', '/#reviews'], ['About', '/about'], ['FAQ', '/faq']];
    return {
      px: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7',
      links: items.map(([label, href]) => {
        const on = label === active;
        return { label, href, cur: on ? 'page' : undefined, bc: on ? '#CC0000' : 'transparent', color: on ? '#FFFFFF' : '#E2DFD9' };
      })
    };
  }
}
</script>
</body>
</html>
