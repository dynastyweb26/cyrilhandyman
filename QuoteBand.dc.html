<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="font-family:'Instrument Sans',system-ui,sans-serif">
  <section style="background:#CC0000;color:#FFFFFF;padding:clamp(48px,5.5cqi,88px) clamp(20px,5.5cqi,80px)">
    <div style="max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:32px">
      <h2 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(38px,5cqi,80px);line-height:.95;letter-spacing:-.035em;max-width:820px;text-wrap:balance">{{ heading }} <span style="font-family:Newsreader,serif;font-style:italic;font-weight:400;letter-spacing:-.01em">We’ll take it from there.</span></h2>
      <div style="display:flex;flex-wrap:wrap;gap:12px">
        <a href="tel:+19453444580" style="background:#0A0A0B;color:#FFFFFF;font-weight:700;font-size:18px;padding:0 28px;min-height:56px;display:flex;align-items:center" style-hover="background:#17171A;color:#FFFFFF" style-focus="outline:3px solid #FFFFFF;outline-offset:3px">Call 945-344-4580</a>
        <a href="#quote" style="border:2px solid #FFFFFF;color:#FFFFFF;font-weight:700;font-size:18px;padding:0 26px;min-height:56px;display:flex;align-items:center" style-hover="background:#FFFFFF;color:#CC0000" style-focus="outline:3px solid #0A0A0B;outline-offset:3px">Request a quote</a>
      </div>
    </div>
  </section>
  <section id="quote" style="background:#17171A;color:#F5F3EF;padding:clamp(56px,6.5cqi,104px) clamp(20px,5.5cqi,80px)">
    <div style="max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px 80px">
      <div style="display:flex;flex-direction:column;gap:20px">
        <span style="font-size:13px;font-weight:700;letter-spacing:.16em;color:#E0483E">REQUEST A QUOTE</span>
        <h2 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(34px,3.6cqi,56px);line-height:1;letter-spacing:-.03em">Tell us about the job.</h2>
        <p style="margin:0;font-size:17px;line-height:1.6;color:#BDB7AE;max-width:440px">We’ll call you back to talk it through and set a time. Rather talk now? <a href="tel:+19453444580" style="color:#F5F3EF;font-weight:700;text-decoration:underline;text-underline-offset:3px">945-344-4580</a></p>
        <span style="font:12px/1.5 ui-monospace,Menlo,monospace;color:#8F8A82">[CONFIRM callback time with Cyril]</span>
      </div>
      <form action="[PLACEHOLDER: form endpoint]" method="post" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px">
        <input type="hidden" name="city" value="{{ city }}">
        <input type="hidden" name="source_page" value="{{ source }}">
        <label style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600;color:#E8E3DB">Name<input name="name" autocomplete="name" style="min-height:52px;background:#0A0A0B;border:1px solid #3A3A40;color:#F5F3EF;padding:0 14px;font:16px 'Instrument Sans',sans-serif" style-focus="outline:3px solid #E0483E;outline-offset:1px"></label>
        <label style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600;color:#E8E3DB">Phone<input name="phone" type="tel" autocomplete="tel" style="min-height:52px;background:#0A0A0B;border:1px solid #3A3A40;color:#F5F3EF;padding:0 14px;font:16px 'Instrument Sans',sans-serif" style-focus="outline:3px solid #E0483E;outline-offset:1px"></label>
        <label style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600;color:#E8E3DB">Service<select name="service" defaultValue="{{ service }}" style="min-height:52px;background:#0A0A0B;border:1px solid #3A3A40;color:#F5F3EF;padding:0 12px;font:16px 'Instrument Sans',sans-serif" style-focus="outline:3px solid #E0483E;outline-offset:1px"><option value="">Choose one</option><option value="garage-doors">Garage doors</option><option value="faux-wood-blinds">Faux wood blinds</option><option value="patio-screens">Patio screens</option><option value="media-accent-walls">Media &amp; accent walls</option><option value="christmas-lights">Christmas lights</option><option value="other">Something else</option></select></label>
        <sc-if value="{{ hasCity }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600;color:#E8E3DB">Town<span style="min-height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border:1px dashed #3A3A40;color:#F5F3EF;font-weight:500;font-size:16px">{{ city }}, TX<span style="font:11px ui-monospace,Menlo,monospace;color:#8F8A82">hidden field · pre-filled</span></span></div>
        </sc-if>
        <sc-if value="{{ noCity }}" hint-placeholder-val="{{ true }}">
          <label style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600;color:#E8E3DB">Town<select name="city_select" style="min-height:52px;background:#0A0A0B;border:1px solid #3A3A40;color:#F5F3EF;padding:0 12px;font:16px 'Instrument Sans',sans-serif" style-focus="outline:3px solid #E0483E;outline-offset:1px"><option>Choose your town</option><option>Forney</option><option>Mesquite</option><option>Sunnyvale</option><option>Rockwall</option><option>Terrell</option><option>Crandall</option><option>Garland</option><option>Frisco</option><option>Somewhere else</option></select></label>
        </sc-if>
        <label style="grid-column:1/-1;display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600;color:#E8E3DB">What do you need done?<textarea name="message" rows="4" style="background:#0A0A0B;border:1px solid #3A3A40;color:#F5F3EF;padding:12px 14px;font:16px/1.5 'Instrument Sans',sans-serif;resize:vertical" style-focus="outline:3px solid #E0483E;outline-offset:1px"></textarea></label>
        <button type="submit" style="grid-column:1/-1;justify-self:start;background:#CC0000;color:#FFFFFF;border:0;font:700 17px 'Instrument Sans',sans-serif;padding:0 32px;min-height:56px;cursor:pointer" style-hover="background:#A30000" style-focus="outline:3px solid #F5F3EF;outline-offset:3px">Send request</button>
      </form>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;city&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;service&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;One call gets it on the calendar.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;source&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const city = this.props.city || '';
    return {
      city, hasCity: !!city, noCity: !city,
      service: this.props.service || '',
      source: this.props.source || '',
      heading: this.props.heading || 'One call gets it on the calendar.'
    };
  }
}
</script>
</body>
</html>
