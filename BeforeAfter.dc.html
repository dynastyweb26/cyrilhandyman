<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ box }}" onPointerDown="{{ down }}" onPointerMove="{{ move }}" onPointerUp="{{ up }}" onPointerCancel="{{ up }}" style="position:relative;width:100%;height:100%;overflow:hidden;background:#232329;touch-action:pan-y;user-select:none;cursor:ew-resize">
  <div style="position:absolute;inset:0;background:#232329">
    <div style="position:absolute;top:0;bottom:0;left:50%;right:0;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;font:500 11px/1.5 ui-monospace,Menlo,monospace;color:#8F8B84">{{ afterSlot }}</div>
    <img src="{{ px }}" alt="{{ altAfter }}" loading="lazy" decoding="async" draggable="false" data-slot="{{ idAfter }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
    <span style="position:absolute;right:16px;bottom:16px;padding:6px 10px;background:#0A0A0B;font:600 11px/1 'Instrument Sans',sans-serif;letter-spacing:.14em;color:#D6D2CB">AFTER · [ PHOTO ]</span>
  </div>
  <div style="position:absolute;inset:0;background:#1A1A1E;clip-path:{{ clip }}">
    <div style="position:absolute;top:0;bottom:0;left:0;right:50%;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;font:500 11px/1.5 ui-monospace,Menlo,monospace;color:#8F8B84">{{ beforeSlot }}</div>
    <img src="{{ px }}" alt="{{ altBefore }}" loading="lazy" decoding="async" draggable="false" data-slot="{{ idBefore }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
    <span style="position:absolute;left:16px;bottom:16px;padding:6px 10px;background:#0A0A0B;font:600 11px/1 'Instrument Sans',sans-serif;letter-spacing:.14em;color:#D6D2CB">BEFORE · [ PHOTO ]</span>
  </div>
  <div style="position:absolute;top:0;bottom:0;left:{{ left }};width:2px;margin-left:-1px;background:#CC0000;pointer-events:none"></div>
  <div role="slider" tabIndex="0" aria-label="Before and after comparison" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ pos }}" aria-valuetext="{{ vt }}" onKeyDown="{{ key }}" style="position:absolute;top:50%;left:{{ left }};width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#CC0000;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font:700 20px/1 'Instrument Sans',sans-serif;cursor:ew-resize;transition:background-color .15s" style-hover="background-color:#A80000" style-focus="outline:2px solid #F5F3EF;outline-offset:3px">↔</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:533},&quot;beforeSlot&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;[ BEFORE 3:2 · 1800×1200 ]&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;afterSlot&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;[ AFTER 3:2 · 1800×1200 ]&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slotId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ba&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;altBefore&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;altAfter&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { pos: 50 };
  box = React.createRef();
  setFrom = (x) => {
    const r = this.box.current.getBoundingClientRect();
    this.setState({ pos: Math.max(0, Math.min(100, ((x - r.left) / r.width) * 100)) });
  };
  down = (e) => { this.drag = true; e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId); this.setFrom(e.clientX); };
  move = (e) => { if (this.drag) this.setFrom(e.clientX); };
  up = () => { this.drag = false; };
  key = (e) => {
    const step = e.shiftKey ? 10 : 4;
    const m = { ArrowLeft: -step, ArrowDown: -step, ArrowRight: step, ArrowUp: step };
    if (m[e.key] != null) { e.preventDefault(); this.setState(s => ({ pos: Math.max(0, Math.min(100, s.pos + m[e.key])) })); }
    if (e.key === 'Home') this.setState({ pos: 0 });
    if (e.key === 'End') this.setState({ pos: 100 });
  };
  renderVals() {
    const p = this.state.pos;
    const id = this.props.slotId ?? 'ba';
    return {
      px: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7',
      box: this.box, down: this.down, move: this.move, up: this.up, key: this.key,
      pos: Math.round(p), vt: Math.round(p) + '% before shown',
      left: p + '%', clip: `inset(0 ${100 - p}% 0 0)`,
      beforeSlot: this.props.beforeSlot ?? '[ BEFORE 3:2 · 1800×1200 ]',
      afterSlot: this.props.afterSlot ?? '[ AFTER 3:2 · 1800×1200 ]',
      idBefore: id + '-before', idAfter: id + '-after',
      altBefore: this.props.altBefore ?? '[ALT: Before — service, city]',
      altAfter: this.props.altAfter ?? '[ALT: After — service, city]'
    };
  }
}
</script>
</body>
</html>
